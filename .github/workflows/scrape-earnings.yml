name: Scrape Finviz Earnings

# Runs CONTINUOUSLY as a chain: each run scrapes for a fixed time budget,
# stops cleanly (see FINVIZ_TIME_BUDGET_MINUTES below), and as its last
# step starts the next run itself (see "Start the next run" at the bottom).
# Every run picks up wherever the last one left off (one row per run in
# ScraperProgress), so together they cover the full ~5,336-ticker universe,
# sweep after sweep, without ever needing more than one run writing at a
# time.
#
# WHY A CHAIN, NOT JUST THE SCHEDULE: GitHub's scheduler is best-effort.
# Measured on this repo (5 Oct - 4 Nov 2026): scheduled runs started a
# median ~4 hours late, about 1 in 8 six-hourly slots never ran at all, and
# after switching to hourly only 2 of ~21 slots ran. GitHub's docs say
# scheduled runs can be delayed or dropped under load. Runs started by
# workflow_dispatch, by contrast, start immediately — so each run starts
# the next one that way.
#
# If a run FAILS, the next run is still started — unless the two runs
# before it failed too. Three failures in a row means something is really
# broken (Finviz blocking, the Apps Script down), so the chain stops rather
# than loop; the backup schedule tries again later, once per delivered
# slot. Cancelling a run yourself stops the chain. To stop everything:
# Actions tab > this workflow > "..." > Disable workflow.
#
# The queue can never pile up: the concurrency group below allows only one
# run going and one waiting. A newer waiting run replaces an older one.
#
# Also runnable by hand any time from the Actions tab, optionally limited
# to a small number of tickers for a quick test (a limited test run does
# NOT start the chain).
on:
  schedule:
    # BACKUP ONLY. The chain (see top of file) normally keeps runs going on
    # its own; this schedule exists to restart the chain if it ever stops —
    # e.g. after a run that crashed, which deliberately does not start a
    # next run. Not minute 0: GitHub delays scheduled runs most on the
    # hour. If a scheduled run arrives while a chained run is already
    # waiting, GitHub cancels one of the two waiting runs ("Canceling since
    # a higher priority waiting request ... exists") — harmless: one of
    # them still runs, and it continues the chain.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      tickers_limit:
        description: 'Optional: only process the first N tickers of today''s remaining list (for a quick test run). Leave blank for a full run.'
        required: false
        default: ''

# CRITICAL — without this, a manual run and a scheduled run (or two
# scheduled runs back to back, if one overruns its window) can start at
# the same time and both hit Finviz simultaneously, roughly doubling the
# effective request rate against the same site from the same handful of
# IPs — confirmed in production to trigger exactly the kind of
# progressive slowdown that eventually escalates into outright renderer
# timeouts. It also means both runs read the SAME progress cursor at
# their own start time and re-scrape overlapping tickers, wasting
# Actions minutes for zero net progress, and risks a race where whichever
# run's checkpoint writes last overwrites a further-ahead run's progress
# with a stale value.
#
# This group applies across BOTH trigger types (schedule AND
# workflow_dispatch) — a static group name, not one keyed to the
# specific trigger, is what makes "a manual run and a scheduled run
# collide" impossible, not just "two scheduled runs collide."
# cancel-in-progress: false means a new trigger QUEUES behind whatever's
# currently running rather than killing it — the current run either
# finishes naturally or hits its own timeout-minutes cutoff, then the
# queued one starts. Nothing is ever running two-at-a-time.
concurrency:
  group: scrape-finviz-earnings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The built-in token may only read the repo by default. actions: write
    # lets the last step start the next run of this workflow; nothing else
    # is granted.
    permissions:
      contents: read
      actions: write
    # Last-resort safety net. A normal run ends on its own at roughly
    # 50 min (setup ~1-2 min + 45 min scraping + up to ~2.5 min for the
    # last ticker + saving and sorting ~1-3 min). The scraper step has its
    # own, shorter limit (54 min, see "Run scraper") so that if scraping
    # ever overruns, only that step is stopped and the chain step at the
    # bottom still gets to run. If THIS job limit is ever hit instead,
    # GitHub kills the whole job and the backup schedule restarts the
    # chain. Either way nothing is lost beyond the last unfinished
    # 20-ticker batch, and that run's ScraperProgress row is left at
    # status "running", which is how you can tell.
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome (for Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        # See the job's timeout-minutes above for why this step has its own.
        timeout-minutes: 54
        env:
          # --- Secrets: real values live in GitHub Settings > Secrets,
          # never in this file or anywhere in the repo's code/history. ---
          FINVIZ_WEB_APP_URL: ${{ secrets.FINVIZ_WEB_APP_URL }}
          FINVIZ_TICKERS_SPREADSHEET_ID: ${{ secrets.FINVIZ_TICKERS_SPREADSHEET_ID }}

          # --- Plain config: not sensitive, safe to keep visible here. ---
          FINVIZ_TICKERS_FROM_SHEET: "true"
          FINVIZ_TICKERS_SHEET_NAME: "Raw_Universe"
          FINVIZ_TICKERS_COLUMN: "Ticker"

          # Clean stop: scrape for this many minutes, then save, sort and
          # exit normally (status "stopped on time"). Must leave room under
          # timeout-minutes above for setup, the last ticker and the sort.
          FINVIZ_TIME_BUDGET_MINUTES: "45"

          # Only set when this workflow was triggered manually with a
          # value typed into the "tickers_limit" box above — empty for
          # every scheduled (cron) run, which correctly means "no limit,
          # full run" (see FINVIZ_TICKERS_LIMIT in env.example).
          FINVIZ_TICKERS_LIMIT: ${{ github.event.inputs.tickers_limit }}
        run: python finviz_earnings_scraper.py

      - name: Upload local CSV preview as a downloadable artifact
        if: always()  # still useful to see even if the run partially failed
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-run-${{ github.run_number }}
          path: scraped_data/
          retention-days: 14

      # THE CHAIN. Starts the next run of this same workflow. It waits in
      # the concurrency queue until this run has fully finished, then
      # carries on from this run's progress row.
      #
      # When it runs (the "if:" line):
      #   - not if this run was cancelled (by you, or by GitHub replacing a
      #     waiting run) — cancelling means "stop".
      #   - not after a manual test limited to N tickers. For scheduled and
      #     chained runs the input doesn't exist, which counts as empty.
      #   - otherwise yes, even if the scraper step failed, because of the
      #     brake below.
      #
      # THE BRAKE: if the scraper step failed, look at the last two runs of
      # this workflow that actually ran (cancelled ones skipped). If both of
      # those failed too, this is the third failure in a row: stop the
      # chain instead of looping. Otherwise try again with a fresh run.
      #
      # GitHub documents that a workflow's own GITHUB_TOKEN is allowed to
      # start new runs via workflow_dispatch (unlike most other events).
      - name: Start the next run (keeps the sweep going continuously)
        if: ${{ !cancelled() && !inputs.tickers_limit }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          if [ "$SCRAPE_OUTCOME" != "success" ]; then
            earlier_failures=$(gh run list --workflow scrape-earnings.yml --status completed --limit 10 \
              --json conclusion \
              --jq '[.[] | select(.conclusion != "cancelled")][:2] | map(select(.conclusion == "failure")) | length' \
              || echo 0)
            if [ "${earlier_failures:-0}" -ge 2 ]; then
              echo "::warning::Third failed run in a row: NOT starting another run. Check the logs; the backup schedule will try again later."
              exit 0
            fi
            echo "Scraper step failed (outcome: $SCRAPE_OUTCOME), but the previous runs did not both fail — starting a fresh run."
          fi
          for attempt in 1 2 3; do
            if gh workflow run scrape-earnings.yml --ref "$GITHUB_REF_NAME"; then
              echo "Next run requested."
              exit 0
            fi
            echo "Could not start the next run (attempt $attempt of 3); retrying in 20s..."
            sleep 20
          done
          echo "::error::Could not start the next run after 3 attempts. The backup schedule will restart the chain."
          exit 1